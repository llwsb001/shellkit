name: desktop

# The native shell needs headers this project's Linux dev box does not have,
# so the build lives here instead of on that box. Wails v3 defaults to GTK4 +
# WebKitGTK 6.0 on Linux; GTK3 + WebKitGTK 4.1 is the opt-in `gtk3` tag, and
# both are built below so neither path can rot.
on:
  push:
    branches: [main]
    paths:
      - "internal/desktop/**"
      - "internal/core/**"
      - "internal/ui/**"
      - "internal/cli/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "internal/desktop/**"
      - "internal/core/**"
      - "internal/ui/**"
      - "internal/cli/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install webview headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            pkg-config

      - name: pkg-config sanity
        run: pkg-config --modversion gtk4 webkitgtk-6.0 gtk+-3.0 webkit2gtk-4.1

      - name: build default (gtk4)
        run: go build -tags desktop -trimpath -ldflags "-s -w -X main.version=ci" -o shellkit-desktop .

      - name: build gtk3 variant
        run: go build -tags "desktop gtk3" -trimpath -ldflags "-s -w -X main.version=ci" -o shellkit-desktop-gtk3 .

      - name: smoke (no display)
        run: |
          # No X server here, so only prove the binary starts and fails on
          # display, not on a missing shared object.
          for bin in shellkit-desktop shellkit-desktop-gtk3; do
            set +e
            timeout 5 ./$bin desktop >$bin.log 2>&1
            code=$?
            set -e
            echo "$bin exit=$code"; head -10 $bin.log
            if grep -qi "undefined symbol\|cannot open shared object" $bin.log; then exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: shellkit-desktop-linux-amd64
          path: |
            shellkit-desktop
            shellkit-desktop-gtk3
          retention-days: 14
