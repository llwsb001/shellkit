name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, "go.mod", "go.sum", "internal/**", "main.go"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/llwsb001/shellkit

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # One platform, loaded into the local daemon, so the smoke test below
      # tests the image this commit actually produced (PR included).
      - name: build for smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: shellkit:ci
          build-args: VERSION=ci
          cache-from: type=gha

      - name: smoke
        run: |
          trap 'docker rm -f sk || true' EXIT
          docker run -d --name sk -p 3427:3427 shellkit:ci
          curl -sS --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 \
            http://127.0.0.1:3427/healthz
          curl -fsS -X POST http://127.0.0.1:3427/api/notes \
            -H 'content-type: application/json' -d '{"text":"from the image"}'
          curl -fsS http://127.0.0.1:3427/api/notes
          # serve is the headless shape: no page route at all, API unaffected.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3427/)" = "404"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sk)
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          echo "health: $status"
          test "$status" = "healthy"

      - name: build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
