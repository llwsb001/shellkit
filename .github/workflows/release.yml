name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (v0.1.0)"
        required: true

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatched run must build the tag it publishes, not the branch tip.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/shellkit-${GOOS}-${GOARCH}${ext}" .

      - uses: actions/upload-artifact@v4
        with:
          name: shellkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 3

  publish:
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          # Sorted, so the file is reproducible for the same inputs.
          : > SHA256SUMS
          for f in $(ls -1 | grep -v SHA256SUMS | sort); do sha256sum "$f" >> SHA256SUMS; done
          cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Idempotent: a re-run of an existing release uploads and overwrites
          # assets instead of failing the job.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* --generate-notes --title "$TAG" \
              --repo "${{ github.repository }}"
          fi
